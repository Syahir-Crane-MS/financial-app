on:
  push:
    branches:
      - dev

name: Deploy website on push

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, xml
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Project
        env:
          CACHE_STORE: array
          DB_CONNECTION: array
        run: |
          php artisan optimize:clear
          php artisan storage:link || true
          npm run build

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.dev_ftp_host }}
          username: ${{ secrets.dev_ftp_username }}
          password: ${{ secrets.dev_ftp_password }}
          exclude: |
            **/tests/**
            **/storage/**
            **/bootstrap/cache/**
            .git/**
            **/.git/**
            **/node_modules/**
            **/vendor/**
            **/.env
            .github/**
            .editorconfig
            .gitattributes
            .gitignore
            jsconfig.json
            package-lock.json
            package.json
            phpunit.xml
            postcss.config.js
            tailwind.config.js
            vite.config.js
            .env
            .env.dev
            .env.example
          dangerousCleanSlate: false
